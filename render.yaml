# Render Blueprint: New → Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: wizard-arena
    runtime: node
    plan: standard        # what the live service runs on (set by Ty); "free" would sleep after ~15 min idle
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit   # every push to the default branch redeploys
    envVars:
      - key: NODE_VERSION       # pin the runtime; package.json only says ">=18"
        value: "22"
      # round 18 saves (server/saves.js): set in the dashboard, never in the repo. sync: false keeps the dashboard's values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
