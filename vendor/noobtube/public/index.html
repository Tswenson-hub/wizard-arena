<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noob Tube</title>
  <style>html,body{background:#1a1d24;height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}canvas#view{width:100vw;height:100vh;display:block}#hud{pointer-events:none;color:#fff;-webkit-user-select:none;user-select:none;position:fixed;inset:0}#menu{color:#fff;background:#0a0c12b8;flex-direction:column;justify-content:center;align-items:center;gap:12px;display:flex;position:fixed;inset:0}#menu h1{letter-spacing:2px;margin:0;font-size:64px}#menu p{opacity:.8;margin:0}#menu.hidden{display:none}#menu button{color:#fff;cursor:pointer;background:#ff7a1a;border:0;border-radius:8px;margin:0 8px;padding:12px 28px;font:600 20px system-ui}#menu button:hover{background:#ff9440}#menu button.play{border-radius:14px;padding:16px 64px;font-size:34px;box-shadow:0 6px #b8500c}#menu button.secondary{background:#ffffff24;padding:8px 18px;font-size:15px}#menu button.secondary:hover{background:#ffffff3d}#menu button:disabled{opacity:.5;cursor:wait}#menu .menu-row{flex-wrap:wrap;justify-content:center;gap:8px;max-width:92vw;display:flex}#menu .menu-row button{margin:0}#menu-main,#menu-pause{flex-direction:column;align-items:center;gap:12px;display:flex}#menu-pause,#menu.paused #menu-main{display:none}#menu.paused #menu-pause{display:flex}#menu [hidden]{display:none!important}#menu .arena-only{display:none}#menu.arena-open .arena-only:not([hidden]){display:inline-block}#menu.arena-open [data-action=arena],#menu.arena-open .play{display:none}body.trailer .th-hint{display:none!important}#menu.paused h1:after{content:" · PAUSED";vertical-align:middle;opacity:.7;font-size:.4em}</style>

  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="menu"><h1>NOOB TUBE</h1>
    <div id="menu-main">

    <div id="menu-progress"></div>
      <div class="menu-row">

        <button class="secondary arena-only" data-mode="course" data-veteran hidden>Sky Course</button>
                <button class="secondary arena-only" data-action="arena-back">Back</button>

        <button class="secondary" data-action="class">Class</button>
        <button class="secondary" data-action="settings">Settings</button>

    </div><p id="capture-note" style="font:12px monospace;opacity:.8;margin:0"></p><p id="menu-keys">WASD move · Space jump · LMB fire · 1 / 2 grenades · F class ability</p></div>
